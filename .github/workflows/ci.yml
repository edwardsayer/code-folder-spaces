name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消舊的執行，節省 runner 額度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 快速門檻：不啟動 VS Code，只跑型別、單元測試、建置與 manifest／i18n／命令契約。
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Project health, manifest contract and l10n parity
        run: npm run check:project

      - name: Command parity
        run: node scripts/check-command-parity.mjs

  # 整合測試：在 xvfb 下以真實 VS Code Extension Host 執行。
  # 矩陣在「支援下限」與「最新穩定版」兩端各跑一次，確保 engines.vscode 宣告不是空話。
  integration:
    name: integration (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # engines.vscode 為 ^1.85.0；這裡驗的是宣告的最低支援版本。
          - vscode: '1.85.1'
            label: minimum
          - vscode: 'stable'
            label: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VS Code 在 Linux 需要這些共用函式庫才能啟動（xvfb-run 只負責虛擬顯示）。
      # 套件名在 Ubuntu 22.04 與 24.04 之間不同（24.04 起部分套件改為 *t64）。
      # 這裡用 apt-cache 偵測後綴，避免 runner 版本升級時整套 CI 失效（曾因寫死 t64 而失敗）。
      - name: Install VS Code runtime libraries
        run: |
          sudo apt-get update
          T64=""
          if apt-cache show libasound2t64 >/dev/null 2>&1; then T64="t64"; fi
          echo "using t64 suffix: '${T64:-none}'"
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libasound2${T64} libatk-bridge2.0-0${T64} libatk1.0-0${T64} libatspi2.0-0${T64} \
            libcairo2 libcups2${T64} libdbus-1-3 libdrm2 libgbm1 libglib2.0-0${T64} \
            libgtk-3-0${T64} libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2

      # 明確指定要測的 VS Code 版本；.vscode-test.mjs 會優先使用 VSCODE_TEST_VERSION，
      # 只有在設定檔找不到本機安裝時才回退，CI 上一定走 test-electron 下載。
      - name: Integration tests (${{ matrix.label }})
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration

      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.label }}-logs
          path: |
            .vscode-test/**
            out/integration/**
          retention-days: 7
          if-no-files-found: ignore

  # 打包衛生：確認 .vsix 不含原始碼、測試、開發目錄與 sourcemap，且不洩漏截圖。
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Package VSIX
        run: npm run package:vsix

      - name: Assert packaging hygiene
        run: |
          set -euo pipefail
          VSIX=$(ls folder-spaces-*.vsix | head -n 1)
          echo "VSIX: $VSIX"
          unzip -l "$VSIX"

          # 不該進包的路徑（見 .vscodeignore）
          for pattern in '/src/' '/tests/' '/scripts/' '/dev/' '/out/' '\.map$' 'assets/screenshots/'; do
            if unzip -l "$VSIX" | grep -qE "$pattern"; then
              echo "::error::packaging hygiene failed: $pattern found in $VSIX"
              exit 1
            fi
          done

          # README 的圖片應已被 vsce 改寫成 GitHub raw 絕對網址（VSIX 內不帶圖檔）。
          if ! unzip -p "$VSIX" extension/readme.md | grep -q 'raw/HEAD/assets/screenshots/'; then
            echo '::error::README screenshots are not rewritten to remote URLs'
            exit 1
          fi

          echo 'packaging hygiene OK'

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: folder-spaces-vsix
          path: folder-spaces-*.vsix
          retention-days: 7
