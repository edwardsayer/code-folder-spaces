<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Front folder: vibrant modern blue -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#2478f2" />
    </linearGradient>

    <!-- Back folder: warm amber gold -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ba5d" />
      <stop offset="100%" stop-color="#cf8e2c" />
    </linearGradient>

    <!-- Switch badge: Obsidian purple gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d72ff" />
      <stop offset="100%" stop-color="#5e28cd" />
    </linearGradient>

    <!-- Subtle drop shadow for depth on light and dark backgrounds -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Scaled up folder & badge (scale 1.28 centered at 64,64) filling ~120px -->
  <g transform="translate(64, 64) scale(1.28) translate(-68, -67.5)" filter="url(#folderShadow)">
    <!-- Back folder (Multi-space representation) -->
    <path d="M34 26a5 5 0 0 1 5-5h19l7 8h32a5 5 0 0 1 5 5v16H34z" fill="url(#backGrad)" opacity="0.95" />
    <!-- Back folder subtle crease line -->
    <path d="M34 34.5h67" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4" />

    <!-- Front solid folder -->
    <path d="M22 42a6 6 0 0 1 6-6h21l8 9h45a6 6 0 0 1 6 6v48a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6z" fill="url(#folderGrad)" />
    <!-- Folder front pocket crease line (slightly lower, brighter and bolder) -->
    <path d="M22 56.5h86" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.2" />

    <!-- Badge: Solid Obsidian Purple Circle with crisp white outline (Scheme A) -->
    <circle cx="88" cy="88" r="24.5" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3.2" />

    <!-- Remote Explorer Opposing Chevrons in crisp white -->
    <g transform="translate(88, 88) scale(3.55556) translate(-17.25, -17.8177)" fill="#ffffff">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M17.251 19.3177C17.251 19.2187 17.231 19.1217 17.194 19.0307C17.156 18.9397 17.101 18.8567 17.031 18.7867L14.781 16.5367C14.64 16.3957 14.449 16.3167 14.25 16.3167C14.051 16.3167 13.86 16.3957 13.719 16.5367C13.578 16.6777 13.499 16.8687 13.499 17.0677C13.499 17.2667 13.578 17.4577 13.719 17.5987L15.44 19.3177L13.719 21.0367C13.578 21.1777 13.499 21.3687 13.499 21.5677C13.499 21.7667 13.578 21.9577 13.719 22.0987C13.86 22.2397 14.051 22.3187 14.25 22.3187C14.449 22.3187 14.64 22.2397 14.781 22.0987L17.031 19.8487C17.101 19.7787 17.156 19.6967 17.194 19.6057C17.232 19.5147 17.251 19.4167 17.251 19.3177Z" />
      <path fill-rule="evenodd" clip-rule="evenodd" d="M19.06 16.3177L20.78 14.5987C20.921 14.4577 21 14.2667 21 14.0677C21 13.8687 20.921 13.6777 20.78 13.5367C20.639 13.3957 20.448 13.3167 20.249 13.3167C20.05 13.3167 19.859 13.3957 19.718 13.5367L17.468 15.7867C17.398 15.8567 17.343 15.9387 17.305 16.0307C17.267 16.1217 17.248 16.2197 17.248 16.3177C17.248 16.4157 17.268 16.5137 17.305 16.6057C17.343 16.6967 17.398 16.7797 17.468 16.8487L19.718 19.0987C19.859 19.2397 20.05 19.3187 20.249 19.3187C20.448 19.3187 20.639 19.2397 20.78 19.0987C20.921 18.9577 21 18.7667 21 18.5677C21 18.3687 20.921 18.1777 20.78 18.0367L19.06 16.3177Z" />
    </g>
  </g>
</svg>